worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 32; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Match the original URI, not a decoded/normalized substitute.
    map $request_uri $allowed_read {
        default 0;
        /_ping 1;
        /version 1;
        ~^/(v[0-9]+\.[0-9]+/)?containers/minecraft-server/json$ 1;
    }
    upstream engine { server unix:/var/run/docker.sock; }
    server {
        listen unix:/run/docker-read-only/docker.sock;
        client_max_body_size 1k;
        if ($request_method !~ ^(GET|HEAD)$) { return 403; }
        if ($allowed_read = 0) { return 403; }
        location / {
            proxy_pass http://engine;
            proxy_http_version 1.1;
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Host docker;
            proxy_set_header Connection "";
            proxy_set_header Content-Length "";
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_send_timeout 2s;
            proxy_buffering off;
            proxy_next_upstream off;
        }
    }
}
