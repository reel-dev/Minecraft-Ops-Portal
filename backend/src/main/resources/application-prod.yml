spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          portal:
            provider: portal
            client-id: ${OIDC_CLIENT_ID}
            client-secret: ${OIDC_CLIENT_SECRET}
            scope: openid,profile
        provider:
          portal:
            issuer-uri: ${OIDC_ISSUER_URI}
